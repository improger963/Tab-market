    <script>
      (function () {
        try {
          var h = window.location.hostname;
          var isProd = h === 'tab.am' || h === 'www.tab.am';
          if (isProd) {
            var el = document.getElementById('robots-meta');
            if (el) el.setAttribute('content', 'index,follow');
          }
        } catch (e) {}
